name: Build Pegasus

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - bedrock-26.50-prep
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure native mod
        shell: pwsh
        run: cmake -S './Source/Mod' -B 'C:/pegasus-build' -G 'Visual Studio 17 2022' -A x64

      - name: Build native mod
        shell: pwsh
        run: cmake --build 'C:/pegasus-build' --config Debug

      - name: Run native tests
        shell: pwsh
        run: ctest --test-dir 'C:/pegasus-build' -C Debug --output-on-failure

      - name: Stage DLL and pin injector hash
        shell: pwsh
        run: |
          $dll = 'C:/pegasus-build/Debug/BedrockUtilityFramework.Xray.dll'
          if (!(Test-Path $dll)) { throw "Native DLL was not produced: $dll" }
          Copy-Item $dll './BedrockUtilityFramework.Xray.dll' -Force
          $hash = (Get-FileHash './BedrockUtilityFramework.Xray.dll' -Algorithm SHA256).Hash
          $sourcePath = './Source/Injector/Pegasus.cs'
          $source = Get-Content $sourcePath -Raw
          $updated = [regex]::Replace(
            $source,
            'internal const string ExpectedHash = "[A-Fa-f0-9]+";',
            "internal const string ExpectedHash = `"$hash`";"
          )
          if ($updated -eq $source) { throw 'Could not update injector DLL hash.' }
          Set-Content -Path $sourcePath -Value $updated -Encoding UTF8
          Write-Host "Pinned injector to DLL SHA-256 $hash"

      - name: Build injector
        shell: pwsh
        run: ./Source/Injector/build.ps1

      - name: Verify package files
        shell: pwsh
        run: |
          if (!(Test-Path './Pegasus.exe')) { throw 'Pegasus.exe was not produced.' }
          if (!(Test-Path './BedrockUtilityFramework.Xray.dll')) { throw 'DLL is missing.' }
          New-Item -ItemType Directory -Path './artifact/Pegasus/tools' -Force | Out-Null
          Copy-Item './Pegasus.exe' './artifact/Pegasus/'
          Copy-Item './BedrockUtilityFramework.Xray.dll' './artifact/Pegasus/'
          Copy-Item './README.md' './artifact/Pegasus/'
          Copy-Item './BUILDING.md' './artifact/Pegasus/'
          Copy-Item './BEDROCK_26_50.md' './artifact/Pegasus/'
          Copy-Item './tools/check-bedrock-compat.ps1' './artifact/Pegasus/tools/'
          Get-FileHash './artifact/Pegasus/Pegasus.exe' -Algorithm SHA256 | Format-List
          Get-FileHash './artifact/Pegasus/BedrockUtilityFramework.Xray.dll' -Algorithm SHA256 | Format-List

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: Pegasus-Windows-x64-${{ github.sha }}
          path: artifact/Pegasus
          if-no-files-found: error
          retention-days: 14
